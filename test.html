        function calculateSupplyShock(data) {
            let cumulativeTokens = 0;

            return data.map((row, index) => {
                const totalReleased = Object.keys(row).reduce((sum, key) => {
                    if (key !== 'Month' && typeof row[key] === 'number') {
                        return sum + row[key];
                    }
                    return sum;
                }, 0);

                const supplyShock =
                    index === 0 ? 0 : (totalReleased / cumulativeTokens) * 100; // Convert to percentage

                cumulativeTokens += totalReleased;

                return {
                    Month: row.Month,
                    SupplyShock: supplyShock,
                    TotalReleased: totalReleased,
                    CumulativeTokens: cumulativeTokens,
                };
            });
        }

        const supplyShockData = calculateSupplyShock(processedEmissionsData);

        // Prepare data for Plotly
        const months = supplyShockData.map((d) => d.Month);
        const supplyShocks = supplyShockData.map((d) => d.SupplyShock);

        // Plotly chart configuration
        const data = [
            {
                x: months,
                y: supplyShocks,
                type: 'bar',
                marker: {
                    color: supplyShocks,
                    colorscale: 'RdBu', // Red to blue gradient
                },
                hovertemplate: "<b>Month %{x}</b><br>Supply Shock: %{y:.2f}%",
            },
        ];

        const layout = {
            title: 'Monthly Supply Shock Scale',
            xaxis: { title: 'Months' },
            yaxis: { title: 'Supply Shock (%)', tickformat: '%' },
            annotations: [
                {
                    x: 4, // Selected month for annotation
                    y: supplyShocks[1],
                    text: 'Current Month',
                    showarrow: true,
                    arrowhead: 2,
                },
            ],
        };

        Plotly.newPlot('supplyShockChart', data, layout);
